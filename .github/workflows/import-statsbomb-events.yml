- name: Report download size
        run: |
          du -sh statsbomb_events
          python3 - <<'EOF'
          import json, pathlib
          total = 0
          for f in pathlib.Path("statsbomb_events").glob("*.json"):
              total += len(json.load(open(f, encoding="utf-8")))
          print(f"TOTAL EVENTS: {total:,}")
          EOF
